name: Samba Interop

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  samba-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SMOLDER_SAMBA_HOST: 127.0.0.1
      SMOLDER_SAMBA_USERNAME: smolder
      SMOLDER_SAMBA_PASSWORD: smolderpass
      SMOLDER_SAMBA_SHARE: share
      SMOLDER_SAMBA_DOMAIN: WORKGROUP
      SMOLDER_SAMBA_ENCRYPTED_SHARE: SMOLDERENC
      SMOLDER_SAMBA_RPC_PORT: 1446
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Prepare Samba fixture directories
        run: scripts/prepare-samba-fixture.sh

      - name: Build and start ready Samba fixtures
        run: scripts/start-samba-fixture.sh

      - name: Run Samba core and tools matrix
        run: scripts/run-interop.sh --samba --core --tools

      - name: Stop Samba fixtures
        if: always()
        run: docker compose -f docker/samba/compose.yaml down
