name: Bench Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check proto benches
        run: cargo +1.85.0 check --locked --benches -p smolder-proto

      - name: Check core benches
        run: cargo +1.85.0 check --locked --benches -p smolder-smb-core
