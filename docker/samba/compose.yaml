x-samba-fixture: &samba-fixture
  build:
    context: .
  image: smolder-samba-fixture:trixie-4.22.10
  environment:
    TZ: UTC
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    interval: 1s
    timeout: 5s
    retries: 90
    start_period: 1s
  stop_grace_period: 10s

services:
  samba:
    <<: *samba-fixture
    container_name: smolder-samba
    environment:
      TZ: UTC
      SMOLDER_INCLUDE_ENCRYPTED_SHARE: "1"
    ports:
      - "127.0.0.1:1445:445"
    volumes:
      - ./share:/samba/share
      - ./share-encrypted:/samba/share-encrypted

  samba-netbios:
    <<: *samba-fixture
    container_name: smolder-samba-netbios
    environment:
      TZ: UTC
      SMOLDER_DISABLE_NETBIOS: "no"
      SMOLDER_SMB_PORTS: "139"
    ports:
      - "127.0.0.1:1139:139"
    volumes:
      - ./share:/samba/share

  samba-global-encryption:
    <<: *samba-fixture
    container_name: smolder-samba-global-encryption
    environment:
      TZ: UTC
      SMOLDER_CLIENT_PROTECTION: encrypt
      SMOLDER_GLOBAL_ENCRYPTION: required
    ports:
      - "127.0.0.1:1446:445"
    volumes:
      - ./share:/samba/share
